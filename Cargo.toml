[package]
name = "markup"
version = "0.1.0"
edition = "2024"

[dependencies]
gpui = "0.2.2"
gpui-component = { version = "0.5.1" }
gpui-component-assets = "0.5.1"
gpui-terminal = { path = "gpui-terminal" }
rust-embed = "8.12.0"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
portable-pty = "0.8"
alacritty_terminal = "0.25.1"
anyhow = "1"
parking_lot = "0.12"

[patch.crates-io]
gpui = { path = "components/gpui" }
gpui-component = { path = "components" }

[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 3

[profile.dev.package.markup]
opt-level = 2

[profile.dev.package.gpui]
opt-level = 3

[profile.dev.package.gpui-component]
opt-level = 3

[profile.dev.package.gpui-terminal]
opt-level = 3

[profile.dev.package.alacritty_terminal]
opt-level = 3

[profile.release]
lto = "thin"
codegen-units = 1
opt-level = 3
